name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major]
  push:
    tags: ["v*"]   # manual path: uv version --bump patch && git commit && git tag vX.Y.Z && git push --tags

permissions:
  contents: write   # push bump commit + tag, create GitHub release
  id-token: write   # PyPI trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Bump version, commit, tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv version --bump "${{ inputs.bump }}"
          VERSION=$(uv version --short)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "release: v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"

      - name: Check tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          VERSION=$(uv version --short)
          [ "${GITHUB_REF_NAME}" = "v${VERSION}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject v${VERSION}"; exit 1; }

      - run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --publish-url https://upload.pypi.org/legacy/

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(uv version --short)" dist/* --generate-notes
