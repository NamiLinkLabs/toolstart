[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolstart"
version = "0.1.0"
description = "GPG-encrypted secret injector with interactive profile picker"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.scripts]
ts = "ts:main"

[tool.hatch.build.targets.wheel]
include = ["ts.py"]
